<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Aluno</title>
</head>

<body>

    {% include 'authInfo.html' %}

    <h1 align="center">Remover Aluno</h1>

    <p id="mensagem"></p>

    <div id="conteudoRemover" style="display: none;">

        <p>Seleciona o aluno e indica o novo estado da sua conta.</p>

        <form id="removerAlunoForm">

            <label for="numero_aluno">Número de Aluno:</label>
            <input type="text" id="numero_aluno" required>

            <br><br>

            <label for="estado">Novo Estado:</label>
            <select id="estado" required>
                <option value="">Selecionar estado</option>
                <option value="Inativo">Inativo</option>
                <option value="Transferido">Transferido</option>
                <option value="Concluido">Concluído</option>
            </select>

            <br><br>

            <label for="observacoes">Observações:</label>
            <br>
            <textarea id="observacoes" rows="4" cols="40" maxlength="500"></textarea>

            <br><br>

            <button type="submit">Alterar Estado do Aluno</button>

        </form>

    </div>

    <br>

    <a href="/admin">Voltar ao Menu Admin</a>

    <br><br>

    <a href="/">Voltar à página inicial</a>

    <script src="{{ url_for('static', filename='js/remover_alunos.js') }}"></script>

</body>
</html>
